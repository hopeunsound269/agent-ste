name: STE gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linter self-test
        run: python3 evals/ste_lint.py --self-test
      - name: Prose lints clean under the benchmark linter
        run: |
          python3 evals/lint_readme.py README.md
          python3 evals/lint_readme.py docs/EXAMPLES.md
          python3 evals/lint_readme.py docs/COMPARISON.md
      - name: SKILL.md frontmatter is valid
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          text = pathlib.Path("skills/agent-ste/SKILL.md").read_text()
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert m, "missing frontmatter"
          front = m.group(1)
          assert re.search(r"^name:\s*\S", front, re.M), "missing name"
          assert re.search(r"^description:", front, re.M), "missing description"
          print("frontmatter OK")
          EOF
      - name: Plugin manifests are valid JSON with matching versions
        run: |
          python3 - <<'EOF'
          import json, pathlib, re
          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          assert plugin["name"] == "agent-ste"
          assert market["plugins"][0]["name"] == "agent-ste"
          assert market["plugins"][0]["source"] == "./"
          skill = pathlib.Path("skills/agent-ste/SKILL.md").read_text()
          skill_version = re.search(r"^version:\s*(\S+)", skill, re.M).group(1)
          assert plugin["version"] == skill_version, (
              f"plugin.json {plugin['version']} != SKILL.md {skill_version}")
          print(f"plugin manifests OK, version {skill_version}")
          EOF
